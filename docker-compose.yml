# Culprit report-only agent — monitors the HOST it runs on, opens no ports.
#
#   cp .env.example .env      # then set CULPRIT_HOST and CULPRIT_TOKEN in .env
#   docker compose up -d
#
# Config comes from the .env file (see .env.example). To build the image locally
# instead of pulling from GHCR, comment `image:` and uncomment `build: .`.
services:
  culprit-agent:
    image: ghcr.io/olayzen/culprit-agent:latest
    # build: .
    container_name: culprit-agent
    restart: unless-stopped

    # Monitor the host, not the container: share its PID + network namespaces.
    # (host network also lets the agent reach the host node and see host sockets.)
    pid: host
    network_mode: host

    # Read other users' /proc/<pid>/io, fd counts and open files.
    cap_add:
      - SYS_PTRACE

    # AppArmor's default docker profile blocks the bulk /proc/<pid>/fd scan that
    # attributes listening ports to processes — with it on, the Ports view lists
    # ports but every one is "another user's process". Lifting the profile (a
    # no-op on hosts without AppArmor) plus SYS_PTRACE gives full attribution.
    security_opt:
      - apparmor:unconfined

    # CULPRIT_HOST, CULPRIT_TOKEN and the optional CULPRIT_* vars come from here.
    env_file:
      - .env

    volumes:
      # OPTIONAL — resolve host UIDs to real login names (else system users show
      # as "uid 101" instead of "systemd-resolve"). Purely cosmetic; everything
      # works without them. Left commented because Portainer's security policy
      # refuses to deploy a stack that bind-mounts /etc/passwd (a 403 on update).
      # Uncomment only if you deploy from the CLI / a Portainer that allows it.
      # - /etc/passwd:/etc/passwd:ro
      # - /etc/group:/etc/group:ro
      # OS identity + Ubuntu Pro reflect the host, not the image's Debian base.
      - /etc/os-release:/etc/os-release:ro
      - /var/lib/ubuntu-advantage:/var/lib/ubuntu-advantage:ro
      # journald events (Events view): journalctl reads these files directly, no
      # daemon needed. Persistent journal assumed; on a volatile-only host mount
      # /run/log/journal:ro instead of /var/log/journal.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Systemd units (Services view), the unit *descriptions* on Ports, and
      # login Sessions: hand the container the host's systemd + D-Bus sockets so
      # systemctl/loginctl can reach the host bus. (Ports already show the unit
      # *name* from each process's cgroup without these; systemd-over-a-socket
      # from a container can be intermittent, and the UI says so when it is.)
      - /run/systemd:/run/systemd:ro
      - /run/dbus:/run/dbus:ro
